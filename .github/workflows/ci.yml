name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Write GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > Kalorie/Kalorie/Resources/GoogleService-Info.plist

      - name: Run tests
        run: |
          xcodebuild test \
            -project Kalorie/Kalorie.xcodeproj \
            -scheme Kalorie \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
