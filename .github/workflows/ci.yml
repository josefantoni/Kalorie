name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > Kalorie/Kalorie/Resources/GoogleService-Info.plist

      - name: Build KMP XCFrameworks
        run: |
          for module in MacroKit MealKit TextKit; do
            SRCROOT="$GITHUB_WORKSPACE/Kalorie" ./scripts/build-kmp-framework.sh "$module"
          done

      - name: Run tests
        run: |
          xcodebuild test \
            -project Kalorie/Kalorie.xcodeproj \
            -scheme Kalorie \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
