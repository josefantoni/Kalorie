name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rules: ${{ steps.filter.outputs.rules }}
      kmp: ${{ steps.filter.outputs.kmp }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      ci: ${{ steps.filter.outputs.ci }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rules:
              - 'backend/**'
              - 'firestore-rules-tests/**'
            kmp:
              - 'ExportKit/**'
              - 'MacroKit/**'
              - 'MealKit/**'
              - 'TextKit/**'
            ios:
              - 'iOS/**'
              - 'scripts/build-kmp-framework.sh'
            android:
              - 'Android/**'
            ci:
              - '.github/workflows/**'

  rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test firestore.rules against the emulator
        working-directory: firestore-rules-tests
        run: |
          npm ci
          npm test

  kmp:
    needs: changes
    if: needs.changes.outputs.kmp == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test KMP modules on JVM
        run: |
          for module in ExportKit MacroKit MealKit TextKit; do
            (cd "$module" && ./gradlew jvmTest)
          done

      - name: Build ExportKit Android target
        working-directory: ExportKit
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"
          fi
          ./gradlew bundleAndroidMainAar

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.kmp == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > iOS/Kalorie/Resources/GoogleService-Info.plist

      - name: Build KMP XCFrameworks
        run: |
          for module in ExportKit MacroKit MealKit TextKit; do
            SRCROOT="$GITHUB_WORKSPACE/iOS" ./scripts/build-kmp-framework.sh "$module"
          done

      - name: Run tests
        run: |
          xcodebuild test \
            -project iOS/Kalorie.xcodeproj \
            -scheme Kalorie \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.kmp == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > Android/app/google-services.json

      - name: Install Android API 37
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"
          fi

      - name: Build and test Android app
        working-directory: Android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

  test:
    needs: [changes, rules, kmp, ios, android]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
