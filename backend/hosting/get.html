<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalorie – Stáhnout / Download</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0; }
  .brand { background: #1B7F6B; padding: 1.75rem 1rem; text-align: center; }
  .brand img { display: block; width: 88px; height: 88px; margin: 0 auto; border-radius: 22%; box-shadow: 0 0 0 2px rgba(255, 255, 255, .3); }
  main { max-width: 40rem; margin: 0 auto; padding: 1rem; text-align: center; }
  .buttons { display: flex; flex-direction: column; gap: .75rem; max-width: 20rem; margin: 1.5rem auto; }
  .buttons a { display: block; padding: .8rem 1rem; border-radius: .6rem; background: #1B7F6B; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<header class="brand"><img src="icon.png" width="88" height="88" alt="Kalorie"></header>
<main>
<h1>Kalorie</h1>
<p>Stáhnout aplikaci / Download the app</p>
<div class="buttons">
<a href="https://apps.apple.com/app/id6823155404">App Store (iPhone, iPad)</a>
<a href="https://play.google.com/store/apps/details?id=antoni.kalorie">Google Play (Android)</a>
</div>
</main>
<script>
  var ua = navigator.userAgent || "";
  if (/android/i.test(ua)) {
    location.replace("https://play.google.com/store/apps/details?id=antoni.kalorie");
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    location.replace("https://apps.apple.com/app/id6823155404");
  }
</script>
</body>
</html>
