<style>
  @font-face { font-family: "Amatic SC"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/amatic-sc-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Amatic SC"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/amatic-sc-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  :root {
    color-scheme: light;
    --green: #1B7F6B;
    --green-dark: #14594b;
    --cream: #F6F2E8;
    --ink: #1f2a27;
    --phone-h: clamp(290px, min(72vw, 64vh), 700px);
  }
  * { box-sizing: border-box; }
  html { background: var(--cream); }
  body {
    margin: 0;
    min-height: 100vh;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream) url("img/bg-tile.webp") 0 0 / 1900px auto repeat;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 700px) { body { background-size: 1150px auto; } }

  .controls { position: absolute; top: .9rem; right: .9rem; z-index: 20; display: flex; align-items: center; gap: .5rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .dropdown { position: relative; }
  .icon-btn {
    display: flex; align-items: center; gap: .4rem;
    height: 40px; padding: 0 .65rem;
    border: .5px solid #111; border-radius: 12px;
    background: #fff; color: #111;
    font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
  }
  .icon-btn:hover { background: #f0f0f0; }
  .icon-btn:focus-visible, .panel button:focus-visible, .panel a:focus-visible, .download:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  .flag { width: 27px; height: 18px; border-radius: 3px; display: block; box-shadow: 0 0 0 .5px #111; margin: .5px; flex: none; }
  .chev { width: 10px; height: 10px; flex: none; transition: transform .15s; }
  .icon-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .burger { width: 40px; padding: 0; justify-content: center; }
  .burger svg { width: 20px; height: 20px; }

  .panel {
    position: absolute; right: 0; top: calc(100% + .45rem);
    min-width: 11rem; margin: 0; padding: .35rem; list-style: none;
    background: #fff; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(20, 60, 50, .22), 0 0 0 1px rgba(0, 0, 0, .15);
  }
  .panel[hidden] { display: none; }
  .panel button, .panel a {
    display: flex; align-items: center; gap: .6rem; width: 100%;
    padding: .6rem .7rem; border: 0; border-radius: 10px; background: none;
    color: var(--ink); font: inherit; text-align: left; text-decoration: none; cursor: pointer;
  }
  .panel button:hover, .panel a:hover { background: #f0f0f0; }
  .panel button[aria-checked="true"] { background: #e6e6e6; font-weight: 700; }
  #menu-panel { min-width: 16rem; }

  main { flex: 1; width: 100%; max-width: 62rem; margin: 0 auto; padding: 4.5rem 1rem 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }


  .stage { display: flex; align-items: stretch; justify-content: center; gap: clamp(.8rem, 4vw, 3rem); width: 100%; }
  .platform { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1.1rem; }
  .separator { align-self: stretch; width: 1px; background: rgba(60, 60, 67, .29); margin: .5rem 0; }
  @media (min-resolution: 2dppx) { .separator { width: .5px; } }
  @media (min-resolution: 3dppx) { .separator { width: .333px; } }

  .device {
    position: relative;
    height: var(--phone-h);
    aspect-ratio: 640 / var(--ratio);
    filter: drop-shadow(0 18px 22px rgba(20, 50, 44, .3));
  }
  .device.ios { --ratio: 1305; --app: #000; --mask: url(img/mask-ios.png); --l: 4.7%; --t: 1.85%; --r: 4.7%; --b: 1.85%; }
  .device.android { --ratio: 1347; --app: #000; --mask: url(img/mask-android.png); --l: 4.184%; --t: 2.022%; --r: 5.035%; --b: 1.752%; }
  .screen-wrap { position: absolute; inset: 0; background: var(--app); -webkit-mask: var(--mask) 0 0 / 100% 100% no-repeat; mask: var(--mask) 0 0 / 100% 100% no-repeat; }
  .screen { position: absolute; left: var(--l); top: var(--t); width: calc(100% - var(--l) - var(--r)); height: calc(100% - var(--t) - var(--b)); object-fit: cover; object-position: top; background: #fff; }
  .frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .download {
    position: relative; display: flex; align-items: center; justify-content: center;
    --w: clamp(170px, 50vw, 240px); width: var(--w); aspect-ratio: 640 / 318; margin-top: 1.4rem;
    color: #fff; text-decoration: none; text-align: center;
    font-family: "Amatic SC", "Arial Narrow", sans-serif; font-weight: 700; font-size: calc(var(--w) * .17); line-height: 1;
    animation: pulse 2s ease-in-out infinite;
    transition: scale .15s, rotate .15s;
  }
  .download::before { content: ""; position: absolute; inset: 0; background: url("img/blob.webp") center / 100% 100% no-repeat; filter: drop-shadow(0 4px 0 rgba(20, 89, 75, .25)); }
  .download span { position: relative; display: block; padding-bottom: .12em; translate: -.1em 0; }
  .download:hover, .download:focus-visible { scale: 1.06; rotate: -2deg; }
  @keyframes pulse { 0%, 30%, 100% { transform: scale(1); } 15% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .download { animation: none; } }

  footer { text-align: center; padding: 0 1rem 1.5rem; font-size: .85rem; }
</style>
<noscript><style>.controls { display: none; }</style></noscript>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flag-cs" viewBox="0 0 3 2"><rect width="3" height="2" fill="#fff"/><rect y="1" width="3" height="1" fill="#D7141A"/><path d="M0 0 1.5 1 0 2Z" fill="#11457E"/></symbol>
  <symbol id="flag-sk" viewBox="0 0 9 6"><rect width="9" height="6" fill="#fff"/><rect y="2" width="9" height="2" fill="#0B4EA2"/><rect y="4" width="9" height="2" fill="#EE1C25"/><path d="M1.6 1.1h2.4v2.2c0 .8-.6 1.4-1.2 1.7-.6-.3-1.2-.9-1.2-1.7Z" fill="#EE1C25" stroke="#fff" stroke-width=".18"/><path d="M2.8 1.8v2.4M2.2 2.5h1.2" stroke="#fff" stroke-width=".28"/></symbol>
  <symbol id="flag-en" viewBox="0 0 60 40"><clipPath id="uk-t"><path d="M30 20h30v20zv20h-30zh-30v-20zv-20h30z"/></clipPath><rect width="60" height="40" fill="#012169"/><path d="M0 0 60 40M60 0 0 40" stroke="#fff" stroke-width="8"/><path d="M0 0 60 40M60 0 0 40" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="2.7"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="11"/><path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="6.5"/></symbol>
</svg>

<div class="controls">
    <div class="dropdown">
      <button class="icon-btn" id="lang-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lang-panel" aria-label="Jazyk / Language">
        <svg class="flag" id="lang-flag" aria-hidden="true"><use href="#flag-cs"/></svg>
        <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ul class="panel" id="lang-panel" hidden>
        <li><button type="button" data-lang="cs" role="menuitemradio" aria-checked="true"><svg class="flag" aria-hidden="true"><use href="#flag-cs"/></svg>Čeština</button></li>
        <li><button type="button" data-lang="sk" role="menuitemradio" aria-checked="false"><svg class="flag" aria-hidden="true"><use href="#flag-sk"/></svg>Slovenčina</button></li>
        <li><button type="button" data-lang="en" role="menuitemradio" aria-checked="false"><svg class="flag" aria-hidden="true"><use href="#flag-en"/></svg>English</button></li>
      </ul>
    </div>
    <div class="dropdown">
      <button class="icon-btn burger" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel" aria-label="Menu">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5h16M2 10h16M2 15h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <ul class="panel" id="menu-panel" hidden>
        <li><a id="link-privacy" href="/privacy#cs" data-i18n="privacy">Zásady ochrany osobních údajů</a></li>
        <li><a id="link-delete" href="/delete-account#cs" data-i18n="delete">Smazání účtu</a></li>
      </ul>
    </div>
  </div>

<main>
  <h1 class="sr-only">Kalorie</h1>
  <div class="stage">
    <section class="platform">
      <div class="device ios"><div class="screen-wrap"><img class="screen" id="shot-ios" src="img/ios-cs.webp" alt="Kalorie – iPhone"></div><img class="frame" src="img/frame-ios.webp" alt=""></div>
    </section>
    <div class="separator" role="presentation"></div>
    <section class="platform">
      <div class="device android"><div class="screen-wrap"><img class="screen" id="shot-android" src="img/android-cs.webp" alt="Kalorie – Android"></div><img class="frame" src="img/frame-android.webp" alt=""></div>
    </section>
  </div>
  <a class="download" href="/get"><span data-i18n="download">Stáhnout</span></a>
</main>

<script>
(function () {
  var T = {
    cs: { title: "Kalorie", desc: "Jednoduchý kalorický deník pro iPhone i Android.", download: "Stáhnout", privacy: "Zásady ochrany osobních údajů", "delete": "Smazání účtu" },
    sk: { title: "Kalorie", desc: "Jednoduchý kalorický denník pre iPhone aj Android.", download: "Stiahnuť", privacy: "Zásady ochrany osobných údajov", "delete": "Zmazanie účtu" },
    en: { title: "Kalorie", desc: "A simple calorie diary for iPhone and Android.", download: "Download", privacy: "Privacy policy", "delete": "Delete account" }
  };
  var KEY = "kalorie-lang";
  var $ = function (id) { return document.getElementById(id); };

  function initial() {
    try { var s = localStorage.getItem(KEY); if (s && T[s]) return s; } catch (e) {}
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) {
      var p = String(list[i]).toLowerCase().slice(0, 2);
      if (T[p]) return p;
    }
    return "en";
  }

  function setLang(l) {
    var t = T[l];
    document.documentElement.lang = l;
    document.title = t.title;
    document.querySelector('meta[name="description"]').setAttribute("content", t.desc);
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) { el.textContent = t[el.getAttribute("data-i18n")]; });
    $("lang-flag").firstElementChild.setAttribute("href", "#flag-" + l);
    $("shot-ios").src = "img/ios-" + l + ".webp";
    $("shot-android").src = "img/android-" + l + ".webp";
    $("link-privacy").href = "/privacy#" + l;
    $("link-delete").href = "/delete-account#" + l;
    Array.prototype.forEach.call(document.querySelectorAll("#lang-panel button"), function (b) {
      b.setAttribute("aria-checked", b.getAttribute("data-lang") === l ? "true" : "false");
    });
    try { localStorage.setItem(KEY, l); } catch (e) {}
  }

  var pairs = [["lang-btn", "lang-panel"], ["menu-btn", "menu-panel"]];
  function closeAll(except) {
    pairs.forEach(function (p) {
      if (p[0] === except) return;
      $(p[1]).hidden = true;
      $(p[0]).setAttribute("aria-expanded", "false");
    });
  }
  pairs.forEach(function (p) {
    $(p[0]).addEventListener("click", function (e) {
      e.stopPropagation();
      var open = $(p[1]).hidden;
      closeAll(p[0]);
      $(p[1]).hidden = !open;
      this.setAttribute("aria-expanded", open ? "true" : "false");
    });
    $(p[1]).addEventListener("click", function (e) { e.stopPropagation(); });
  });
  document.addEventListener("click", function () { closeAll(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeAll(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("#lang-panel button"), function (b) {
    b.addEventListener("click", function (e) { setLang(b.getAttribute("data-lang")); closeAll(); if (e.detail === 0) { $("lang-btn").focus(); } });
  });

  setLang(initial());
})();
</script>
</body>
</html>
